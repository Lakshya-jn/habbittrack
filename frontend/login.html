<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>HabbitTrack — Login</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
:root {
  --bg: #0f1117; --bg2: #161b26; --card: #1c2233;
  --border: #2a3147; --border2: #3a4460; --text: #f0f2ff; --muted: #7a85a8;
  --orange: #f97316; --orange-light: #ff9a4a; --orange-dim: rgba(249,115,22,0.15);
  --orange-glow: rgba(249,115,22,0.3); --purple: #8b5cf6; --blue: #3b82f6;
  --green: #10b981; --green-dim: rgba(16,185,129,0.15);
  --red: #ef4444; --red-dim: rgba(239,68,68,0.15);
}
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Space Grotesk', sans-serif;
  min-height: 100vh;
  min-height: -webkit-fill-available;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
}
.bg-orb { position: fixed; border-radius: 50%; filter: blur(80px); opacity: 0.12; pointer-events: none; }
.bg-orb.one { width: 300px; height: 300px; background: var(--orange); top: -80px; right: -80px; }
.bg-orb.two { width: 250px; height: 250px; background: var(--purple); bottom: -60px; left: -60px; }
.auth-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 24px;
  padding: 32px 24px;
  width: 100%;
  max-width: 420px;
  position: relative;
  overflow: hidden;
}
.auth-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 3px;
  background: linear-gradient(90deg, var(--orange), var(--purple), var(--blue));
}
.logo { display:flex; align-items:center; gap:12px; margin-bottom:28px; justify-content:center; }
.logo-icon { width:44px; height:44px; background:var(--orange); border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:22px; box-shadow:0 0 24px var(--orange-glow); }
.logo-name { font-family:'Nunito',sans-serif; font-weight:900; font-size:1.6rem; letter-spacing:-0.5px; }
.logo-name span { color:var(--orange); }
.tabs { display:flex; background:var(--bg2); border-radius:12px; padding:4px; margin-bottom:24px; gap:4px; }
.tab-btn { flex:1; padding:10px; border:none; border-radius:9px; background:transparent; color:var(--muted); font-family:'Space Grotesk',sans-serif; font-size:0.88rem; font-weight:600; cursor:pointer; transition:all .2s; }
.tab-btn.active { background:var(--card); color:var(--text); box-shadow:0 2px 8px rgba(0,0,0,0.3); }
.form-group { margin-bottom:16px; }
.form-label { display:block; font-size:0.75rem; color:var(--muted); font-weight:600; text-transform:uppercase; letter-spacing:0.8px; margin-bottom:8px; }
.form-input {
  width:100%;
  background:var(--bg2);
  border:1.5px solid var(--border);
  border-radius:12px;
  padding:14px 16px;
  color:var(--text);
  font-family:'Space Grotesk',sans-serif;
  font-size:1rem;
  font-weight:500;
  outline:none;
  transition:border-color .2s, box-shadow .2s;
  -webkit-appearance: none;
}
.form-input:focus { border-color:var(--orange); box-shadow:0 0 0 3px var(--orange-dim); }
.form-input::placeholder { color:var(--muted); }
.submit-btn {
  width:100%;
  background:var(--orange);
  color:#fff;
  border:none;
  border-radius:12px;
  padding:16px;
  font-family:'Nunito',sans-serif;
  font-weight:800;
  font-size:1rem;
  cursor:pointer;
  transition:all .2s;
  box-shadow:0 4px 20px var(--orange-glow);
  margin-top:8px;
  -webkit-appearance: none;
}
.submit-btn:active { transform:scale(.97); opacity:.9; }
.submit-btn:disabled { opacity:.6; cursor:not-allowed; }
.msg { padding:12px 16px; border-radius:10px; font-size:0.82rem; font-weight:600; margin-bottom:16px; display:none; }
.msg.error { background:var(--red-dim); color:var(--red); border:1px solid rgba(239,68,68,0.3); display:block; }
.msg.success { background:var(--green-dim); color:var(--green); border:1px solid rgba(16,185,129,0.3); display:block; }
.features { margin-top:24px; display:flex; justify-content:center; gap:16px; flex-wrap:wrap; }
.feature { display:flex; align-items:center; gap:5px; font-size:0.7rem; color:var(--muted); font-weight:500; }

/* Mobile specific */
@media (max-width: 480px) {
  body { padding: 12px; align-items: flex-start; padding-top: 40px; }
  .auth-card { padding: 28px 20px; border-radius: 20px; }
  .logo-name { font-size: 1.4rem; }
  .logo-icon { width: 40px; height: 40px; font-size: 20px; }
  .features { gap: 12px; }
  .feature { font-size: 0.68rem; }
}
</style>
</head>
<body>
<div class="bg-orb one"></div>
<div class="bg-orb two"></div>
<div class="auth-card">
  <div class="logo">
    <div class="logo-icon">⛰️</div>
    <div class="logo-name">Habbit<span>Track</span></div>
  </div>
  <div class="tabs" id="mainTabs">
  <button class="tab-btn active" onclick="switchTab('login')">Login</button>
  <button class="tab-btn" onclick="switchTab('signup')">Sign Up</button>
</div>
  <div id="msgBox" class="msg"></div>
  <div id="loginForm">
    <div class="form-group">
      <label class="form-label">Email</label>
      <input class="form-input" id="loginEmail" type="email" placeholder="you@example.com" autocomplete="email"/>
    </div>
    <div class="form-group">
      <label class="form-label">Password</label>
      <input class="form-input" id="loginPassword" type="password" placeholder="Enter your password" autocomplete="current-password"/>
    </div>
    <button class="submit-btn" id="loginBtn" onclick="login()">Login to HabbitTrack 🔥</button>
<div style="text-align:center; margin-top:14px;">
  <span style="font-size:0.78rem; color:var(--muted);">Forgot your password? </span>
  <button onclick="switchTab('forgot')" style="background:none;border:none;color:var(--orange);font-size:0.78rem;font-weight:700;cursor:pointer;font-family:'Space Grotesk',sans-serif;">Reset it</button>
</div>
  </div>
  <div id="forgotForm" style="display:none">
  <div style="text-align:center;margin-bottom:20px;">
    <div style="font-size:2rem;margin-bottom:8px;">🔑</div>
    <div style="font-size:0.85rem;color:var(--muted);line-height:1.5;">Enter your email and we'll send you a link to reset your password.</div>
  </div>
  <div class="form-group">
    <label class="form-label">Email</label>
    <input class="form-input" id="forgotEmail" type="email" placeholder="you@example.com" autocomplete="email"/>
  </div>
  <button class="submit-btn" id="forgotBtn" onclick="forgotPassword()">Send Reset Link 📧</button>
  <div style="text-align:center;margin-top:14px;">
    <button onclick="switchTab('login')" style="background:none;border:none;color:var(--muted);font-size:0.78rem;font-weight:600;cursor:pointer;font-family:'Space Grotesk',sans-serif;">← Back to Login</button>
  </div>
</div>
  <div id="signupForm" style="display:none">
    <div class="form-group">
      <label class="form-label">Full Name</label>
      <input class="form-input" id="signupName" type="text" placeholder="Your name" autocomplete="name"/>
    </div>
    <div class="form-group">
      <label class="form-label">Email</label>
      <input class="form-input" id="signupEmail" type="email" placeholder="you@example.com" autocomplete="email"/>
    </div>
    <div class="form-group">
      <label class="form-label">Password</label>
      <input class="form-input" id="signupPassword" type="password" placeholder="Min 6 characters" autocomplete="new-password"/>
    </div>
    <button class="submit-btn" id="signupBtn" onclick="signup()">Create Account 🚀</button>
  </div>
  <div class="features">
    <div class="feature"><span>🔥</span> Streaks</div>
    <div class="feature"><span>🤖</span> AI Priority</div>
    <div class="feature"><span>📊</span> Heatmap</div>
    <div class="feature"><span>🎊</span> Confetti</div>
  </div>
</div>
<script>
const API = "https://habbittrack-backend.onrender.com";
function switchTab(tab) {
  const tabs = document.getElementById("mainTabs");
  tabs.style.display = tab === "forgot" ? "none" : "flex";
  document.querySelectorAll(".tab-btn").forEach((b,i) => b.classList.toggle("active", (i===0&&tab==="login")||(i===1&&tab==="signup")));
  document.getElementById("loginForm").style.display = tab === "login" ? "block" : "none";
  document.getElementById("signupForm").style.display = tab === "signup" ? "block" : "none";
  document.getElementById("forgotForm").style.display = tab === "forgot" ? "block" : "none";
  hideMsg();
}
function showMsg(text, type) { const box = document.getElementById("msgBox"); box.textContent = text; box.className = "msg " + type; }
function hideMsg() { document.getElementById("msgBox").className = "msg"; }
async function login() {
  const email = document.getElementById("loginEmail").value.trim();
  const password = document.getElementById("loginPassword").value;
  if (!email || !password) { showMsg("Please fill in all fields", "error"); return; }
  const btn = document.getElementById("loginBtn");
  btn.disabled = true; btn.textContent = "Logging in...";
  try {
    const res = await fetch(`${API}/api/auth/login`, { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({email, password}) });
    const data = await res.json();
    if (data.error) { showMsg(data.error, "error"); }
    else {
      localStorage.setItem("ht_token", data.token);
      localStorage.setItem("ht_user", JSON.stringify(data.user));
      showMsg("Login successful! Redirecting...", "success");
      setTimeout(() => window.location.href = "app.html", 800);
    }
  } catch(e) { showMsg("Cannot connect to server. Try again!", "error"); }
  btn.disabled = false; btn.textContent = "Login to HabbitTrack 🔥";
}
async function forgotPassword() {
  const email = document.getElementById("forgotEmail").value.trim();
  if (!email) { showMsg("Please enter your email", "error"); return; }
  const btn = document.getElementById("forgotBtn");
  btn.disabled = true; btn.textContent = "Sending...";
  try {
    const res = await fetch(`${API}/api/auth/forgot-password`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email })
    });
    const data = await res.json();
    if (data.error) { showMsg(data.error, "error"); }
    else {
      showMsg("✅ Reset link sent! Check your email.", "success");
      setTimeout(() => switchTab("login"), 3000);
    }
  } catch(e) {
    showMsg("Cannot connect to server. Try again!", "error");
  }
  btn.disabled = false; btn.textContent = "Send Reset Link 📧";
}
async function signup() {
  const name = document.getElementById("signupName").value.trim();
  const email = document.getElementById("signupEmail").value.trim();
  const password = document.getElementById("signupPassword").value;
  if (!name || !email || !password) { showMsg("Please fill in all fields", "error"); return; }
  if (password.length < 6) { showMsg("Password must be at least 6 characters", "error"); return; }
  const btn = document.getElementById("signupBtn");
  btn.disabled = true; btn.textContent = "Creating account...";
  try {
    const res = await fetch(`${API}/api/auth/signup`, { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({email, password, name}) });
    const data = await res.json();
    if (data.error) { showMsg(data.error, "error"); }
    else { showMsg("Account created! Please login.", "success"); setTimeout(() => switchTab("login"), 2000); }
  } catch(e) { showMsg("Cannot connect to server. Try again!", "error"); }
  btn.disabled = false; btn.textContent = "Create Account 🚀";
}
document.addEventListener("keydown", e => { if(e.key==="Enter") { if(document.getElementById("loginForm").style.display!=="none") login(); else signup(); } });
// Check if this is a password reset redirect
const hashParams = new URLSearchParams(window.location.hash.substring(1));
const accessToken = hashParams.get("access_token");
const type = hashParams.get("type");
if (type === "recovery" && accessToken) {
  window.location.href = "reset.html" + window.location.hash;
} else if (localStorage.getItem("ht_token")) {
  window.location.href = "app.html";
}
</script>
</body>
</html>
